name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Android SDK packages
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK cmdline-tools not found at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          fi
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/signing/release.keystore

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: signing/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          ./gradlew --no-daemon -PreleaseVersionName="$VERSION_NAME" -PreleaseVersionCode="$VERSION_CODE" assembleRelease
        working-directory: android

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/release/SpeedXpat-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" --verify-tag --title "SpeedXpat $GITHUB_REF_NAME" --generate-notes
